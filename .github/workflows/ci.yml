name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    environment: public-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
  native:
    runs-on: ubuntu-latest
    environment: public-ci
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
  app:
    # The real app on Linux, through tauri-driver: Tauri's HTTP client, the
    # Rust commands and the bundled template (tests/e2e/smoke.mjs).
    runs-on: ubuntu-22.04
    environment: public-ci
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: cargo install tauri-driver --locked
      - run: npx tauri build --debug --no-bundle
      - run: |
          xvfb-run -a sh -c 'tauri-driver & sleep 3; node tests/e2e/smoke.mjs "$PWD/src-tauri/target/debug/gild-desktop"'
