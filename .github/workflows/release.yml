# Builds gild desktop for macOS (Apple silicon and Intel) and Linux and
# attaches the bundles to the GitHub release for the pushed tag.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: gild desktop ${{ github.ref_name }}
          releaseBody: |
            Install gild into your own Cloudflare account with one API token, then work in it.
            macOS: open the .dmg and drag gild to Applications. The app is signed and notarized by Apple.
            Linux: the .AppImage or .deb.
          releaseDraft: false
          args: --target ${{ matrix.target }}
